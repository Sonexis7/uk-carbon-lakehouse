name: Lakehouse Pipeline & Data Governance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline-quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests deltalake==0.15.3 duckdb pyarrow pandas streamlit "dbt-core<1.9" "dbt-duckdb<1.9"

    - name: Run Lakehouse Ingestion (Bronze -> Silver -> Gold)
      run: |
        python pipeline.py

    - name: Run Financial Audit Engine
      run: |
        python audit_engine.py

    - name: Execute dbt Modeling & Governance Tests
      run: |
        cd dbt_lakehouse
        dbt run --profiles-dir .
        dbt test --profiles-dir .
